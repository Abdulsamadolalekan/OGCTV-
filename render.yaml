# Render blueprint — a persistent Node web service with a disk, which is what OGCTV needs:
# a long-running process, a writable SQLite database and an uploads directory.
#
#   Render dashboard → New → Blueprint → pick this repository
# then set PUBLIC_SITE_URL to the domain Render assigns (or your own domain after you add it),
# and open /admin/setup once to create the first administrator.
services:
  - type: web
    name: ogctv
    runtime: node
    plan: starter
    region: singapore
    branch: main
    healthCheckPath: /
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: node ./dist/server/entry.mjs
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT; the standalone server reads it. HOST must be reachable from the proxy.
      - key: HOST
        value: 0.0.0.0
      - key: OGCTV_DATA_DIR
        value: /var/data/ogctv
      - key: PUBLIC_SITE_URL
        value: https://REPLACE-ME.onrender.com
      - key: NODE_VERSION
        value: 22.23.3
    # The database and uploads must survive restarts and redeploys: a disk, not the container FS.
    disk:
      name: ogctv-data
      mountPath: /var/data/ogctv
      sizeGB: 1
